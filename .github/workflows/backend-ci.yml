name: Backend CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bs_test?schema=public
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/bs_test?schema=public
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access-secret-32ch
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh-secret-ci-32ch
      JWT_ACCESS_TTL_MINUTES: "15"
      JWT_REFRESH_TTL_DAYS: "7"
      BCRYPT_ROUNDS: "4"
      EMAIL_FROM: noreply@test.com
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_USER: ""
      EMAIL_PASS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: TypeScript strict check
        working-directory: backend
        run: npx tsc --noEmit
      - name: Run unit & integration tests
        working-directory: backend
        run: npm run test
