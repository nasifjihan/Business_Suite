name: Backend CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bs_test?schema=public
      # Tests run against this. Required here because vitest.config.ts would
      # otherwise derive "<db>_test" from DATABASE_URL (i.e. bs_test_test),
      # which does not exist in CI. The CI database is created and destroyed
      # per run, so pointing tests at the same one is safe here - unlike on a
      # developer machine, where it would wipe their working data.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bs_test?schema=public
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access-secret-32ch
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh-secret-ci-32ch
      # Names must match the Zod schema in backend/src/config/env.ts.
      # The old JWT_ACCESS_TTL_MINUTES / BCRYPT_ROUNDS / EMAIL_* names were not
      # in that schema, so CI was silently falling back to schema defaults.
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      COOKIE_DOMAIN: localhost
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX: "100"
      DISABLE_RATE_LIMIT: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: TypeScript strict check
        working-directory: backend
        run: npx tsc --noEmit
      - name: Run unit & integration tests
        working-directory: backend
        run: npm run test
