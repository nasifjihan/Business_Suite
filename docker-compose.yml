name: business-suite
services:
  postgres:
    image: postgres:16-alpine
    container_name: bs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bs_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bs_db}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - bsnet

  backend:
    build:
      context: ./backend
      target: production
    container_name: bs-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bs_db}?schema=public&pgbouncer=false
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bs_db}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-insecure-access-secret-change-me-phase-13-local-only-aaaaaaaaaaaaaaaa}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-insecure-refresh-secret-change-me-phase-13-local-only-bbbbbbbbbbbbbbbb}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      EMAIL_FROM: noreply@example.com
      EMAIL_HOST: 127.0.0.1
      EMAIL_PORT: "1025"
      EMAIL_USER: ""
      EMAIL_PASS: ""
      EMAIL_SECURE: "false"
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_LOGIN_MAX: "10"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - bsnet

  nginx:
    image: nginx:1.27-alpine
    container_name: bs-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    networks:
      - bsnet

volumes:
  pgdata:
    name: bs-pgdata

networks:
  bsnet:
    name: bs-network
    driver: bridge
