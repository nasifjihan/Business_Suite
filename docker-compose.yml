  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: business-suite-backend
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   env_file:
  #     - ./backend/.env
  #   environment:
  #     # Override DATABASE_URL to point at the docker 'postgres' service hostname
  #     DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/business_suite?schema=public
  #   ports:
  #     - "5000:5000"
  #   networks:
  #     - bs-net

  # ── pgAdmin 4 (Optional web UI) ─────────────────────────────────────
