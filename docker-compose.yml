name: business-suite
services:
  postgres:
    image: postgres:16-alpine
    container_name: bs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bs_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host 5433 -> container 5432. Your machine already runs a local
      # PostgreSQL 18 on 5432, and two processes cannot bind the same host
      # port: publishing 5432:5432 makes `docker compose up` fail with
      # "port is already allocated". The container-side port stays 5432, so
      # the backend service still connects to postgres:5432 over bsnet.
      # Connect from the host with: psql -h localhost -p 5433 -U postgres
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bs_db}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - bsnet

  backend:
    build:
      context: ./backend
      target: production
    container_name: bs-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Defaults to the postgres container on bsnet. Override by putting
      # DATABASE_URL in a .env file next to this compose file (gitignored) to
      # point the container at a managed database such as Neon instead - no
      # edit to this file, no rebuild, just `docker compose up -d`.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bs_db}?schema=public&pgbouncer=false}
      # Direct (non-pooled) endpoint, used ONLY by `prisma migrate deploy` in
      # the startup CMD. Empty on a local/container database, which has no pooler.
      DIRECT_URL: ${DIRECT_URL:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-insecure-access-secret-change-me-phase-13-local-only-aaaaaaaaaaaaaaaa}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-insecure-refresh-secret-change-me-phase-13-local-only-bbbbbbbbbbbbbbbb}
      # Names below must match the Zod schema in backend/src/config/env.ts.
      # JWT_ACCESS_EXPIRES_IN / BCRYPT_ROUNDS / EMAIL_* / RATE_LIMIT_LOGIN_MAX
      # were not in that schema, so the container silently ran on defaults.
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX: "100"
      DISABLE_RATE_LIMIT: "false"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - bsnet

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        # Build args, NOT environment variables. Next.js inlines NEXT_PUBLIC_*
        # into the browser bundle during `next build` - the browser cannot read
        # a container env var, so the value must be baked in. Putting these in
        # an `environment:` block would silently have no effect.
        #
        # http://localhost/api/v1 points at NGINX (port 80), not at the backend
        # container directly. That makes the UI and the API share one origin, so
        # browser requests are same-origin: no CORS preflight, and no SameSite
        # cookie complications. It is also how the app will behave behind a real
        # proxy in production.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Business Suite}
    container_name: bs-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # No `ports:` on purpose. Nothing outside needs to reach this container
    # directly - nginx proxies to frontend:3000 over the bsnet network. It also
    # avoids fighting your local `npm run dev`, which already owns host 3000.
    healthcheck:
      # 127.0.0.1, not localhost - see the note on the nginx healthcheck below.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bsnet

  nginx:
    image: nginx:1.27-alpine
    container_name: bs-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    healthcheck:
      # 127.0.0.1, NOT localhost. Inside the container /etc/hosts maps localhost
      # to both 127.0.0.1 and ::1, and busybox wget tries the IPv6 address first.
      # nginx here listens on 0.0.0.0:80 (IPv4 only, per "listen 80" in nginx.conf),
      # so the ::1 attempt is refused and the container is marked unhealthy even
      # though it proxies perfectly from the host. The backend healthcheck can use
      # localhost because Node binds dual-stack :: by default; nginx does not.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    networks:
      - bsnet

volumes:
  pgdata:
    name: bs-pgdata

networks:
  bsnet:
    name: bs-network
    driver: bridge
