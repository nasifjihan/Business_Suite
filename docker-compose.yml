# ──────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Phase 13 (Docker Learning)
# ──────────────────────────────────────────────────────────────────────────
# THIS FILE IS A PHASE-13 PLACEHOLDER.
# It will NOT work "out of the box" until Phase 13 when we:
#   1. Add backend/Dockerfile
#   2. Add nginx/nginx.conf + nginx/Dockerfile
#   3. Fill in the environment variables below (or use env_file:)
# ──────────────────────────────────────────────────────────────────────────
#
# Services (when complete):
#   postgres   → PostgreSQL 16/18 container + persistent volume
#   backend    → Node.js container (our Express API)
#   pgadmin    → (Optional) pgAdmin 4 web UI for Postgres at http://localhost:5050
#   nginx      → (Optional) Reverse proxy: http://localhost → frontend / + /api/* → backend
#
# Usage (after Phase 13):
#   docker compose up -d
#   docker compose logs -f backend
#   docker compose exec backend npx prisma migrate deploy
#   docker compose exec backend npx prisma db seed
#   docker compose down          (stops & removes; keeps DB data because volume persists)
#   docker compose down -v       ⚠️ DELETES postgres volume = LOST ALL DATA
# ──────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine                  # Matches installed version locally (18.6)
    container_name: business-suite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: business_suite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123             # TODO Phase 13: match .env DATABASE_URL
      TZ: UTC
    ports:
      - "5432:5432"                          # Map so host tools (Prisma) can connect
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persistent data volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bs-net

  # ── Backend (Express API) ─────────────────────────────────────────
  # TODO Phase 13: Uncomment + create backend/Dockerfile first.
  #
