server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_min_length 1024;

    # Real IP forwarded to backend: Express rate-limit & audit see client not nginx
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ============================================
    # /health → Render-like liveness through proxy
    # ============================================
    location /health {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ============================================
    # /api/* → backend Express REST
    # No trailing slash on proxy_pass = preserve full URI path
    # GET /api/v1/auth/login → backend receives /api/v1/auth/login ✓
    # ============================================
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # ============================================
    # Root /  -> Next.js frontend container
    #
    # Serving the UI and the API from this single origin is the point: the
    # browser sees one site (http://localhost), so /api/v1 calls are same-origin.
    # No CORS preflight, no SameSite cookie edge cases. This is also how the app
    # sits behind a proxy or CDN in a real deployment.
    # ============================================
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        # Required for Next.js: the dev overlay and React server components
        # stream over an upgraded connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
